<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG CARDS</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <h1 id="title">MTG CARDS</h1>
    <span>
      For set list, look here:
      <a href="https://scryfall.com/sets" target="_blank">Click me!</a>
    </span>

    <div id="full_search">
      <form id="search">
        <label for="color">Color: </label>
        <select name="color" id="color">
          <option value="">Any color</option>
          <option value="W">White</option>
          <option value="U">Blue</option>
          <option value="B">Black</option>
          <option value="R">Red</option>
          <option value="G">Green</option>
        </select>

        <label for="type">Card type:</label>
        <select name="type" id="type">
          <option value="">Any type</option>
          <option value="creature">Creature</option>
          <option value="planeswalker">Planeswalker</option>
          <option value="instant">Instant</option>
          <option value="sorcery">Sorcery</option>
          <option value="artifact">Artifact</option>
          <option value="enchantment">Enchantment</option>
          <option value="land">Land</option>
        </select>

        <label for="commander">Commander?</label>
        <select name="commander" id="commander">
          <option value="">Any</option>
          <option value="legal">Legal</option>

          <option value="not_legal">Not Legal</option>
        </select>

        <label for="set">Set:</label>
        <input type="text" id="set" placeholder="Example: neo" />
        <label for="card_name">Card name:</label>
        <input type="text" id="card_name" placeholder="Example: Sheoldred" />

        <button id="submit_btn" type="submit">Search</button>
      </form>
    </div>

    <!-- Hero Section -->
    <section id="hero">
      <!-- Animated carousel -->
      <main id="saved_cards"></main>

      <!-- Static saved cards (Collapsible Section) -->
      <div class="collapsible_container">
        <div class="toggle_header_row"></div>

        <!-- Button transformed -->
        <button
          class="toggle-btn arrow_toggle"
          onclick="toggleSection()"
          aria-label="Toggle Section"
          aria-expanded="false"
        ></button>

        <div class="filter_bar" id="filterBar">
          <span class="filter_title"></span>
          <button class="filter_chip">Name</button>
          <button class="filter_chip">Price</button>
          <button class="filter_chip">Recent</button>
          <button class="filter_chip">Favorites</button>
        </div>

        <!-- This wrapper controls the smooth height expansion -->
        <div class="content_wrapper" id="cardContent">
          <!-- Inner block ensures the content calculates height correctly -->
          <div class="inner-content">
            <div id="saved_cards_static"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="hero_card"></div>
    <!-- Counter container -->
    <div id="counter_container">
      <span id="card_counter"></span>
    </div>

    <!-- Load more button -->
    <button id="load_btn" style="display: none">Load More</button>
    <!-- Main cards -->
    <main id="cards"></main>
    <!-- Loading spinner -->
    <div id="loading_spinner" class="spinner" style="display: none"></div>

    <script>
      function toggleSection() {
        const container = document.querySelector(".collapsible_container");
        const content = document.getElementById("cardContent");
        const btn = document.querySelector(".arrow_toggle");

        const isOpen = content.classList.toggle("open");
        container.classList.toggle("is-active", isOpen);

        if (btn) btn.setAttribute("aria-expanded", isOpen);
      }
    </script>
  </body>
</html>
